<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <style>
        body {
            width: 360px;
            font-family: system-ui, sans-serif;
            padding: 16px;
            background: #1e1e1e;
            color: #eee;
        }

        h3 {
            margin: 0 0 12px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-bottom: 8px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            background: #3b82f6;
            color: #fff;
        }

            button:disabled {
                background: #555;
                cursor: default;
            }

            button.secondary {
                background: #444;
            }

        #status {
            font-size: 12px;
            color: #aaa;
            margin-top: 8px;
            min-height: 18px;
        }

        #preview {
            max-height: 240px;
            overflow-y: auto;
            background: #111;
            border-radius: 6px;
            padding: 8px;
            font-size: 12px;
            white-space: pre-wrap;
            line-height: 1.5;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <h3>Maurice 文本提取器</h3>
    <button id="extractBtn">提取当前页面文本</button>
    <button id="downloadBtn" class="secondary" disabled>下载为 JSON</button>
    <div id="status"></div>
    <div id="preview"></div>
    <script src="popup.js"></script>
</body>
</html>
